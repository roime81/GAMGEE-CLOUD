schema_version: 1
id: function-cloud
name: Function Cloud
description: Native WebAssembly function execution with SpinKube and HTTP request-aware scale-to-zero using KEDA.
implementation: executable-foundation
depends_on: [core-cloud]
components: [spin-wasm-runtime, spin-operator, keda-http-autoscaler]
resources:
  minimum_vcpu: 4
  minimum_ram_gib: 5
  minimum_disk_gib: 20
required_tools: [ansible-playbook]
steps:
  - executor: ansible-playbook
    playbook: automation/ansible/function-cloud.yml
    timeout_seconds: 900
