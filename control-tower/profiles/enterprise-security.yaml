schema_version: 1
id: enterprise-security
name: Enterprise Security
description: Enables Kubernetes admission policy controls using Kyverno. Identity, key management and supply-chain controls are integrated in subsequent security adapters.
implementation: executable-foundation
depends_on: [core-cloud]
components: [kyverno, policy-baseline]
resources:
  minimum_vcpu: 1
  minimum_ram_gib: 2
  minimum_disk_gib: 10
required_tools: [ansible-playbook]
steps:
  - executor: ansible-playbook
    playbook: automation/ansible/enterprise-security.yml
    timeout_seconds: 1200
