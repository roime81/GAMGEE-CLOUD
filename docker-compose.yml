services:
  authentik-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?Set AUTHENTIK_POSTGRES_PASSWORD in .env}
    volumes:
      - authentik-postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  authentik-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - authentik-redis:/data
    restart: unless-stopped

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.4.1
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?Set AUTHENTIK_POSTGRES_PASSWORD in .env}
      AUTHENTIK_REDIS__HOST: authentik-redis
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9443:9443"
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_started
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.4.1
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?Set AUTHENTIK_POSTGRES_PASSWORD in .env}
      AUTHENTIK_REDIS__HOST: authentik-redis
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_started
    restart: unless-stopped

  victoria-metrics:
    image: victoriametrics/victoria-metrics:v1.118.0
    command:
      - --storageDataPath=/victoria-metrics-data
      - --retentionPeriod=30d
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - victoria-metrics:/victoria-metrics-data
    restart: unless-stopped

volumes:
  authentik-postgresql:
  authentik-redis:
  victoria-metrics:
