# Single-node starter sizing. Increase retention and PVC sizes for production.
victoria-metrics-operator:
  enabled: true

vmsingle:
  enabled: true
  spec:
    retentionPeriod: "14d"
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

grafana:
  enabled: true
  persistence:
    enabled: true
    size: 5Gi
