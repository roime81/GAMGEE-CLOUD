apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gamgee-example
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`app.example.com`)
      kind: Rule
      middlewares:
        - name: gamgee-api-ratelimit
      services:
        - name: example-service
          port: 80
  tls:
    certResolver: letsencrypt
